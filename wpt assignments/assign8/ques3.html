<!DOCTYPE html>
<html>
<head>
    <title>Validation</title>
</head>
<body>

<form onsubmit="return validate()">
    <input type="text" id="txt" required minlength="3" maxlength="10">
    <span id="err" style="color:red"></span><br><br>
    <button type="submit">Submit</button>
</form>

<script>
function validate() {
    let val = document.getElementById("txt").value;

    if (val.length < 3 || val.length > 10) {
        document.getElementById("err").innerHTML = "Length must be 3 to 10";
        return false;
    }

    document.getElementById("err").innerHTML = "";
    return true;
}
</script>

</body>
</html>
