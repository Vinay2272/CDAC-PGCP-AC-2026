<!DOCTYPE html>
<html>
<head>
    <title>API Table</title>
</head>
<body>

<h2>Product Data</h2>
<button onclick="loadData()">Load Data</button>

<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Price</th>
        </tr>
    </thead>
    <tbody id="data"></tbody>
</table>

<script>
function loadData() {
    let xhr = new XMLHttpRequest();

    xhr.open("GET", "https://fakestoreapi.com/products", true);

    xhr.onload = function() {
        let res = JSON.parse(xhr.responseText);
        let output = "";

        res.forEach(function(item) {
            output += "<tr>";
            output += "<td>" + item.id + "</td>";
            output += "<td>" + item.title + "</td>";
            output += "<td>" + item.price + "</td>";
            output += "</tr>";
        });

        document.getElementById("data").innerHTML = output;
    };

    xhr.send();
}
</script>

</body>
</html>
